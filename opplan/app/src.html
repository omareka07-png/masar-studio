<title>منظومة التخطيط التشغيلي 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar + right-hand section rail (RTL) + working canvas; rail collapses to a scrolling tab strip on phones */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --ink:#13201C; --muted:#56665F; --line:#D3DCD8;
  --accent:#0D6352; --accent-soft:#D5EBE5; --on-accent:#FFFFFF;
  --plan:#A9BCD9; --plan-ink:#2B4877;
  --ok:#23804F; --ok-soft:#D7EEDF; --warn:#A86A00; --warn-soft:#F6E7C8; --bad:#B8362F; --bad-soft:#F6D9D6; --info:#2F5E9E; --info-soft:#DCE6F4;
  --s1:#B8362F; --s2:#D99A1E; --s3:#23804F; --s4:#7A57B8; --s5:#2F5E9E;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --track:#E3E9E7; --canvas:#EEF1F0; --vborder:#DDE3E1; --c1:#118DFF; --c2:#E66C37; --c3:#9F4CC9; --c4:#1FA187; --c5:#C2185B; --r:8px; --shadow:0 1px 2px rgb(19 32 28 / .06),0 4px 16px rgb(19 32 28 / .05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1E2925; --ink:#E4ECE9; --muted:#97A8A2; --line:#2B3833;
  --accent:#3DB397; --accent-soft:#173A32; --on-accent:#06241D;
  --plan:#3E5784; --plan-ink:#BCCCEA;
  --ok:#55C48A; --ok-soft:#173527; --warn:#E3AE45; --warn-soft:#3A2E14; --bad:#EE7A71; --bad-soft:#3F1F1C; --info:#7FA8E3; --info-soft:#1B2A40;
  --s1:#E0645B; --s2:#E3AE45; --s3:#4DB981; --s4:#A98AE6; --s5:#6E9BDB;
  --track:#24302C; --canvas:#111816; --vborder:#2B3833; --c1:#118DFF; --c2:#E66C37; --c3:#9F4CC9; --c4:#1FA187; --c5:#C2185B; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1E2925; --ink:#E4ECE9; --muted:#97A8A2; --line:#2B3833;
  --accent:#3DB397; --accent-soft:#173A32; --on-accent:#06241D;
  --plan:#3E5784; --plan-ink:#BCCCEA;
  --ok:#55C48A; --ok-soft:#173527; --warn:#E3AE45; --warn-soft:#3A2E14; --bad:#EE7A71; --bad-soft:#3F1F1C; --info:#7FA8E3; --info-soft:#1B2A40;
  --s1:#E0645B; --s2:#E3AE45; --s3:#4DB981; --s4:#A98AE6; --s5:#6E9BDB;
  --track:#24302C; --canvas:#111816; --vborder:#2B3833; --c1:#118DFF; --c2:#E66C37; --c3:#9F4CC9; --c4:#1FA187; --c5:#C2185B; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.6;direction:rtl}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:18px} h2{font-size:17px} h3{font-size:14.5px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:2px}
nav.rail a,.btn{text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand small{color:var(--muted);font-size:12px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;min-height:calc(100% - 60px)}
nav.rail{border-left:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px)}
nav.rail a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--surface-2)}
nav.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav.rail .navsep{height:1px;background:var(--line);margin:8px 4px}
nav.rail svg{width:18px;height:18px;flex:none}
main{padding:20px 24px 48px;min-width:0;display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line);padding:6px 10px;z-index:15}
  nav.rail a{white-space:nowrap;padding:6px 10px}
  nav.rail .navsep{display:none}
  main{padding:16px 16px 40px}
}

.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{margin:2px 0 0;color:var(--muted)}
.pagehead .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel > header p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){.g-dash,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .lbl{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.01em}
.tile .val{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:12.5px;white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th .arr{opacity:.6;font-size:10px}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tr.click{cursor:pointer}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface-2)}
.pbar{display:flex;align-items:center;gap:8px;min-width:120px}
.pbar .bar{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field label .req{color:var(--bad)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
.field.err input,.field.err select,.field.err textarea,td.err input,td.err select{border-color:var(--bad);background:var(--bad-soft)}
.msg{font-size:12px;color:var(--bad);min-height:0}
.hint{font-size:12px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.formgrid .w2{grid-column:span 2}.formgrid .w4{grid-column:1/-1}
@media (max-width:900px){.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid .w2{grid-column:1/-1}}
@media (max-width:520px){.formgrid{grid-template-columns:minmax(0,1fr)}}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:700px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
.months input{text-align:left}
.steps td input,.steps td select{padding:5px 7px;font-size:13px}
.steps td{padding:4px 5px}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-radius:6px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}

/* Gantt */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gt{display:grid;grid-template-columns:200px repeat(52,18px);font-size:11px;min-width:max-content}
.gt > div{border-bottom:1px solid var(--line);height:26px;display:flex;align-items:center;justify-content:center}
.gt .lab{justify-content:flex-start;padding:0 10px;position:sticky;right:0;background:var(--surface);z-index:2;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.gt .mh{font-weight:600;color:var(--muted);border-inline-start:1px solid var(--line);background:var(--surface-2)}
.gt .wk{color:var(--muted);font-variant-numeric:tabular-nums;font-size:10px}
.gt .c{border-inline-start:1px dotted color-mix(in srgb,var(--line) 60%,transparent)}
.gt .c i{display:block;width:100%;height:14px}
.gt .now{box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--accent) 10%,transparent)}
.gt .wk.now{color:var(--accent);font-weight:700}
.st-plan{background:var(--plan)}
.st-1{background:var(--s1)} .st-2{background:var(--s2)} .st-3{background:var(--s3)} .st-4{background:var(--s4)} .st-5{background:var(--s5)}
.st-1,.st-5{background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgb(255 255 255 / .35) 3px 5px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:10px;border-radius:2px;display:inline-block}

.tree details{border-bottom:1px solid var(--line)}
.tree summary{cursor:pointer;padding:10px 4px;display:flex;align-items:center;gap:10px;list-style:none;flex-wrap:wrap}
.tree summary::-webkit-details-marker{display:none}
.tree .code{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);min-width:46px}
.kpirow{display:grid;grid-template-columns:62px minmax(0,1fr) 110px 70px 120px;gap:10px;padding:7px 4px 7px 0;margin-inline-start:24px;border-top:1px dashed var(--line);align-items:center;font-size:13px}
@media (max-width:700px){.kpirow{grid-template-columns:52px minmax(0,1fr);}.kpirow .hm{display:none}}

.banner{border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner.local{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;background:rgb(10 16 14 / .45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--surface);border-radius:var(--r);max-width:440px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dialog .row{display:flex;gap:8px;justify-content:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.diff{font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.diff del{color:var(--bad);text-decoration:line-through;opacity:.8}
.diff ins{color:var(--ok);text-decoration:none}
canvas{max-width:100%}
.chartbox{position:relative;height:260px}
.segbar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.segbar > i{display:block;height:100%}
.statlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.statlist div{display:flex;align-items:center;gap:8px;font-size:13px}
.statlist b{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
/* اللوحة التنفيذية */
.kgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1200px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kcard{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kcard .lbl{color:var(--muted);font-size:12.5px;font-weight:600}
.kcard .val{font-family:var(--f-display);font-size:24px;font-weight:700}
.kcard .val small{font-size:14px;font-weight:500}
.kcard .sub{font-size:12px;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.ggrid{grid-template-columns:minmax(0,1fr)}}
.gaugecard{align-items:center;text-align:center}
.gaugecard svg{width:100%;max-width:220px;height:auto}
.donutwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dlegend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}
.dlegend div{display:flex;align-items:center;gap:8px;font-size:13px}
.dlegend b{margin-inline-start:auto;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pcard .pcrow{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.pcard .bar{margin:4px 0}
.heatwrap{overflow-x:auto}
table.heat{font-size:12px;border-collapse:separate;border-spacing:2px}
table.heat th{background:transparent;position:static;padding:4px}
table.heat td{border:0;padding:6px 4px}
table.heat td:first-child{white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.heat td.hc{text-align:center;min-width:44px;border-radius:3px;font-variant-numeric:tabular-nums}
table.heat th.nowc{color:var(--accent)}
/* مهام اليوم */
.daybar{display:flex;flex-direction:column;gap:12px}
.dnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dname{font-family:var(--f-display);font-size:16px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sday{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;min-width:0}
.sday b{font-size:17px;font-family:var(--f-display)}
.sday:hover{background:var(--surface-2)}
.sday.wkend{opacity:.6}
.sday.tdy{border-color:var(--accent)}
.sday.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent);opacity:1}
.tsum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tsum a{text-decoration:none}
.tgroup > header,.tgroup > summary{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap;cursor:default}
.tgroup > summary{cursor:pointer;list-style:none}
.tgroup h3{display:flex;align-items:center;gap:6px}
.tlist{display:flex;flex-direction:column;gap:8px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;align-items:center;border-inline-start:4px solid var(--line)}
.task.overdue{border-inline-start-color:var(--bad)} .task.due{border-inline-start-color:var(--warn)} .task.start{border-inline-start-color:var(--info)} .task.ongoing{border-inline-start-color:var(--ok)} .task.done{border-inline-start-color:var(--accent);opacity:.8}
.tmain{display:flex;flex-direction:column;gap:2px;min-width:0}
.tmeta{display:flex;gap:4px 14px;flex-wrap:wrap}
.tprog{display:flex;flex-direction:column;gap:8px}
.tact{display:flex;align-items:center;gap:6px}
.tact input{width:72px;padding:4px 8px}
@media (max-width:700px){.task{grid-template-columns:minmax(0,1fr)}}
/* تقرير بأسلوب Power BI */
.pbi{display:flex;flex-direction:column;gap:0;background:var(--canvas);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.pbi-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.pbi-head h2{font-size:16px}
.pbi-tools{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.pbi-body{display:grid;grid-template-columns:minmax(0,1fr) 230px;min-width:0}
.pbi.nopane .pbi-body{grid-template-columns:minmax(0,1fr)}
.pbi-canvas{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.slicers{display:flex;gap:10px;flex-wrap:wrap}
.slicer{background:var(--surface);border:1px solid var(--vborder);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.slicer .sl{font-size:12px;font-weight:600;color:var(--ink)}
.slicer select{min-width:200px;padding:5px 8px}
.tiles-s{display:flex;flex-wrap:wrap;gap:4px}
.stile{border:1px solid var(--vborder);background:var(--surface);padding:4px 10px;font-size:12.5px;cursor:pointer;border-radius:2px;color:var(--ink)}
.stile:hover{background:var(--surface-2)}
.stile.on{background:var(--c1);border-color:var(--c1);color:#fff}
.vgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.vis{background:var(--surface);border:1px solid var(--vborder);border-radius:4px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgb(0 0 0 / .05)}

.vis > header{display:flex;align-items:center;gap:6px;min-height:20px}
.vis h4{margin:0;font-size:13px;font-weight:600;font-family:var(--f-body);color:var(--ink)}
.vis .vh{margin-inline-start:auto;display:flex;gap:2px;position:relative;opacity:0;transition:opacity .12s}
.vis:hover .vh,.vis:focus-within .vh,.vis.focus .vh{opacity:1}
@media (hover:none){.vis .vh{opacity:1}}
.vbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 6px;border-radius:3px;font:inherit;font-size:12.5px}
.vbtn:hover{background:var(--surface-2);color:var(--ink)}
.vbtn.ico{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px}
.vmenu{position:absolute;top:28px;left:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:190px;padding:4px}
.vmenu[hidden],.fpane[hidden]{display:none!important}
.vmenu button{border:0;background:transparent;text-align:right;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px;border-radius:3px}
.vmenu button:hover{background:var(--surface-2)}
.vb{position:relative;min-height:0}
.vis.focus{position:fixed;inset:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;z-index:45;box-shadow:0 0 0 100vmax rgb(10 16 14 / .45)}
.vis.focus .vb{height:auto!important;flex:1}
.cardrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.cardrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcardv{background:var(--surface);border:1px solid var(--vborder);border-radius:4px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.pcardv .cv{font-size:30px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
.pcardv .cl{font-size:13px;color:var(--muted)}
.pcardv .cs{font-size:11.5px;color:var(--muted);opacity:.85}
.gwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px}
.gsvg{width:100%;max-width:300px}
.vtable{overflow:auto;max-height:420px}
.vis.focus .vtable{max-height:none}
.vtable table{font-size:12.5px}
.vtable th{background:var(--surface);border-bottom:2px solid var(--line);color:var(--ink)}
.vtable td{padding:6px 10px}
.vtable tfoot td{border-top:2px solid var(--line)}
.dbar{position:relative;min-width:120px;height:20px;display:flex;align-items:center}
.dbar i{position:absolute;inset-block:2px;right:0;background:color-mix(in srgb,var(--c1) 35%,transparent);border-radius:1px}

.dbar span{position:relative;padding-inline-start:4px}
.fpane{border-inline-start:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.fpane h3{font-size:14px}
.fcard{border:1px solid var(--vborder);border-radius:4px;padding:8px 10px;display:flex;align-items:center;gap:6px;background:var(--canvas)}
.fcard > div{display:flex;flex-direction:column;min-width:0}
.fcard b{font-size:12.5px}
.fcard span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 8%,var(--surface))}
.fcard.on span{color:var(--ink)}
.fcard .vbtn{margin-inline-start:auto}
.ptabs{display:flex;gap:0;border-top:1px solid var(--line);background:var(--surface);overflow-x:auto;padding:0 8px}
.ptab{border:0;background:transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font:inherit;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap}
.ptab:hover{color:var(--ink);background:var(--surface-2)}
.ptab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--c1)}
.pg{--pgl:200px;position:relative;display:flex;flex-direction:column;gap:2px;overflow-x:auto;min-width:0}
.pgrow{display:grid;grid-template-columns:var(--pgl) minmax(420px,1fr);align-items:center;height:28px}
.pgrow.click:hover{background:var(--surface-2)}
.pgl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline-end:10px}
.pgtrack{position:relative;height:100%;border-inline-start:1px solid var(--line)}
.pghead{height:22px}
.pgm{position:absolute;top:2px;font-size:11px;color:var(--muted);padding-inline-start:3px;border-inline-start:1px solid var(--line);line-height:1.1}
.pgbar{position:absolute;top:7px;height:14px;border:1.5px solid;border-radius:3px;overflow:hidden;background:var(--surface)}
.pgbar b{display:block;height:100%;opacity:.85}
.pglate{position:absolute;top:6px;font-size:11px;color:var(--bad);font-weight:600;white-space:nowrap}
.pgnow{position:absolute;top:0;bottom:0;width:0;border-inline-start:1.5px dashed var(--ink);pointer-events:none}
.pgnow span{position:absolute;top:-2px;font-size:10.5px;background:var(--ink);color:var(--bg);padding:0 4px;border-radius:2px;transform:translateX(50%)}
@media (max-width:1000px){
  .vgrid{grid-template-columns:minmax(0,1fr)} .vis{grid-column:1/-1!important}
  .pbi-body{grid-template-columns:minmax(0,1fr)} .fpane{border-inline-start:0;border-top:1px solid var(--line)}
  .pg{--pgl:130px}
}
.mtree{display:flex;flex-direction:column;gap:14px}
.mph{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.mph .btn{margin-inline-start:auto}
.mobj{display:flex;flex-direction:column;gap:4px;padding:6px 0 8px;border-bottom:1px dashed var(--line)}
.mrow{display:flex;gap:8px;align-items:center}
.mrow .code{font-weight:700;color:var(--accent);min-width:40px}
.mrow.mk{padding-inline-start:28px}
.mrow.mk span{min-width:44px}
.mrow select{width:130px;flex:none}
.labgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1000px){.labgrid{grid-template-columns:minmax(0,1fr)}}
.labh{margin:0 0 8px;font-size:13px}
.labrow{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.cmp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:800px){.cmp3{grid-template-columns:minmax(0,1fr)}}
.cmpc{background:var(--surface);border:1px solid var(--vborder);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:right;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.cmpc:hover{border-color:var(--c1)}
.cmpc.on{border-color:var(--c1);box-shadow:inset 0 3px 0 var(--c1)}
.cmpc .cl{font-weight:700;font-size:14px}
.cmpc .cs{font-size:12px;color:var(--muted)}
.cmpn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cmpn div{display:flex;flex-direction:column;align-items:center}
.cmpn b{font-size:22px;font-weight:600;line-height:1.2}
.cmpn span{font-size:11.5px;color:var(--muted)}
/* المظهر والتأثيرات والعرض */
.tbtools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.themeseg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.themeseg button{border:0;background:transparent;color:var(--muted);width:30px;height:26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.themeseg button:hover{color:var(--ink)}
.themeseg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.tbbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.tbbtn:hover{background:var(--surface-2)}
#fxBtn[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
#fxBtn[aria-pressed="false"]{color:var(--muted)}
@media (max-width:600px){.tbbtn span{display:none}}
html,body{transition:background-color .25s}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes vinF{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes vinB{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
main.enter > *{animation:vin .45s cubic-bezier(.2,.7,.2,1) both}
main.enter.fwd > *{animation-name:vinF}
main.enter.back > *{animation-name:vinB}
main.enter :is(.vis,.pcardv,.cmpc,.tile,.kcard,.task,.slicer){animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
body.fx :is(.vis:not(.bare):not(.focus),.pcardv,.cmpc,.tile,.kcard,.task){transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
body.fx :is(.vis:not(.bare):not(.focus),.pcardv,.cmpc,.tile,.kcard):hover{transform:translateY(-3px);box-shadow:0 8px 22px rgb(0 0 0 / .10)}
body.fx .task:hover{transform:translateX(-3px)}
body.fx .btn,body.fx .stile,body.fx .ptab{transition:background-color .15s,transform .1s,color .15s}
body.fx .btn:active,body.fx .stile:active{transform:scale(.97)}
body.fx .bar > i,body.fx .dbar i{transition:width .8s cubic-bezier(.2,.7,.2,1)}
body.presenting .topbar,body.presenting nav.rail{display:none}

#pres{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:55;background:color-mix(in srgb,var(--ink) 88%,transparent);color:var(--bg);border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .3);overflow:hidden;max-width:calc(100% - 32px);backdrop-filter:blur(6px)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ======================= بيانات مرجعية افتراضية (من ETL للملف الأصلي) ======================= */
const DEFAULT_MASTER = /*MASTER*/null;
const SOURCE_ISSUES = /*ISSUES*/[];
DEFAULT_MASTER.year = 2026;

/* ======================= أدوات ======================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NF = new Intl.NumberFormat("ar-SA-u-nu-latn", {maximumFractionDigits: 0});
const NF1 = new Intl.NumberFormat("ar-SA-u-nu-latn", {maximumFractionDigits: 1});
const fmt = n => NF.format(Math.round(+n || 0));
const sar = n => fmt(n) + " ر.س";
const pct = n => NF1.format(+n || 0) + "٪";
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const DT = new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", {dateStyle: "medium", timeStyle: "short"});
const DD = new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", {day: "numeric", month: "short"});
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }
function safeLS(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } }

/* ======================= الحالة ======================= */
const S = {
  mode: "init",           // db | local
  db: null, user: null, downloads: null, me: null,
  canWrite: false, canAdmin: false,
  master: clone(DEFAULT_MASTER),
  projects: new Map(),
  audit: [],
  names: {},
  view: "dashboard", openId: null, draft: null, draftOrig: null,
  filt: {q: "", obj: "", dept: "", pri: "", status: "", sort: "code", dir: 1},
  reportBy: "perspective", touched: {}, triedSave: false, loaded: false,
  theme: safeLS("opplan.theme") || "auto", fx: safeLS("opplan.fx") ?? true, animNext: "in",
};

/* ======================= تقويم الخطة ======================= */
function week1Start(year) { const d = new Date(year, 0, 1); while (d.getDay() !== 6) d.setDate(d.getDate() + 1); return d; } // أول سبت
function weekStart(year, w) { const d = week1Start(year); d.setDate(d.getDate() + (w - 1) * 7); return d; }
function currentWeek(year) {
  const now = new Date(); const s = week1Start(year);
  if (now < s) return now.getFullYear() < year ? 0 : 1;
  const w = Math.floor((now - s) / 864e5 / 7) + 1;
  return Math.min(w, 53);
}
function currentMonth(year) { const n = new Date(); if (n.getFullYear() < year) return 0; if (n.getFullYear() > year) return 12; return n.getMonth() + 1; }
function monthOfWeek(year, w) { return weekStart(year, w).getMonth(); }

/* ======================= منطق المشروع ======================= */
const STATUS = {
  ontrack: {label: "ضمن الخطة", cls: "ok"},
  atrisk: {label: "يحتاج انتباه", cls: "warn"},
  late: {label: "متأخر", cls: "bad"},
  notstarted: {label: "لم يبدأ", cls: "info"},
  done: {label: "مكتمل", cls: "acc"},
};
const CELL_STATES = [
  ["st-1", "أسابيع مجدولة بدون إنجاز"],
  ["st-2", "أسابيع إنجاز ضمن خطة مجدولة لم تكتمل"],
  ["st-3", "أسابيع إنجاز ضمن الخطة الزمنية المجدولة"],
  ["st-4", "أسابيع إنجاز غير منضبط بالخطة المجدولة"],
  ["st-5", "أسابيع الإنجاز قبل أو بعد الخطة الزمنية"],
  ["st-plan", "أسابيع مجدولة قادمة"],
];
function cellState(s, w, cw) {
  const inPlan = w >= s.planStart && w < s.planStart + s.planWeeks;
  const hasAct = s.actStart > 0 && s.actWeeks > 0;
  const inAct = hasAct && w >= s.actStart && w < s.actStart + s.actWeeks;
  if (inPlan && !inAct) return w < cw ? "st-1" : "st-plan";
  if (inPlan && inAct) { if (s.actStart !== s.planStart) return "st-4"; return (+s.pct >= 100) ? "st-3" : "st-2"; }
  if (!inPlan && inAct) return "st-5";
  return "";
}
function metrics(p, year) {
  year = year || S.master.year;
  const cw = currentWeek(year), cm = currentMonth(year);
  const steps = p.steps || [];
  const stepsCost = sum(steps.map(s => s.cost));
  const monthlyTotal = sum(p.monthly || []);
  const totW = sum(steps.map(s => s.planWeeks));
  let progress, expected;
  if (steps.length && totW > 0) {
    progress = sum(steps.map(s => (+s.pct || 0) * s.planWeeks)) / totW;
    expected = sum(steps.map(s => Math.max(0, Math.min(cw - s.planStart, s.planWeeks)) * 100)) / totW;
  } else {
    progress = +p.manualProgress || 0;
    const mt = monthlyTotal;
    expected = mt > 0 ? sum((p.monthly || []).slice(0, Math.max(0, cm - 1))) / mt * 100 : 0;
  }
  let lateWeeks = 0;
  for (const s of steps) for (let w = s.planStart; w < s.planStart + s.planWeeks && w < cw; w++) if (cellState(s, w, cw) === "st-1") lateWeeks++;
  let status;
  if (progress >= 99.95) status = "done";
  else if (expected - progress > 10) status = "late";                                   // فجوة تتجاوز 10 نقاط
  else if (expected - progress > 5 || (lateWeeks > 0 && expected > progress)) status = "atrisk"; // فجوة 5–10 أو أسابيع فائتة
  else if (progress === 0 && expected === 0) status = "notstarted";
  else status = "ontrack";
  return {stepsCost, monthlyTotal, progress, expected, status, lateWeeks, cw};
}
const objOf = id => S.master.objectives.find(o => o.id === id);
const kpiOf = id => S.master.kpis.find(k => k.id === id);
const deptOf = id => S.master.departments.find(d => d.id === id);
const perspOf = id => S.master.perspectives.find(p => p.id === id);
const liveProjects = () => [...S.projects.values()].filter(p => !p.deleted);

/* ======================= التحقق ======================= */
function validate(p) {
  const e = {}, w = [];
  if (!p.name || p.name.trim().length < 3) e.name = "اكتب اسم المشروع (3 أحرف على الأقل).";
  else if (liveProjects().some(x => x.id !== p.id && x.name.trim() === p.name.trim())) e.name = "يوجد مشروع آخر بنفس الاسم.";
  if (!p.objectiveId) e.objectiveId = "اختر الهدف الاستراتيجي.";
  if (!p.kpiId) e.kpiId = "اختر مؤشر الأداء الذي يحركه المشروع.";
  else if (kpiOf(p.kpiId)?.objectiveId !== p.objectiveId) e.kpiId = "المؤشر لا يتبع الهدف المختار.";
  if (!p.deptId) e.deptId = "اختر الإدارة المسؤولة.";
  if (![1, 2, 3].includes(+p.priority)) e.priority = "الأولوية من 1 إلى 3.";
  if (!(+p.budget >= 0)) e.budget = "الموازنة رقم موجب.";
  (p.monthly || []).forEach((m, i) => { if (!(+m >= 0)) e["m" + i] = "قيمة غير صالحة"; });
  if (!p.steps.length && (p.manualProgress < 0 || p.manualProgress > 100)) e.manualProgress = "النسبة بين 0 و 100.";
  p.steps.forEach((s, i) => {
    const k = f => `s${i}.${f}`;
    if (!s.name || !s.name.trim()) e[k("name")] = "اسم الخطوة مطلوب";
    if (!(Number.isInteger(+s.planStart) && s.planStart >= 1 && s.planStart <= 52)) e[k("planStart")] = "أسبوع 1–52";
    if (!(Number.isInteger(+s.planWeeks) && s.planWeeks >= 1)) e[k("planWeeks")] = "مدة ≥ 1";
    else if (+s.planStart + +s.planWeeks - 1 > 52) e[k("planWeeks")] = "تتجاوز الأسبوع 52";
    if (s.actStart && !(s.actStart >= 1 && s.actStart <= 52)) e[k("actStart")] = "أسبوع 1–52";
    if (s.actWeeks && !(s.actWeeks >= 0)) e[k("actWeeks")] = "قيمة غير صالحة";
    if (s.actStart && +s.actStart + +s.actWeeks - 1 > 52) e[k("actWeeks")] = "تتجاوز الأسبوع 52";
    if (s.actWeeks > 0 && !s.actStart) e[k("actStart")] = "حدد أسبوع البداية الفعلية";
    if (!(+s.cost >= 0)) e[k("cost")] = "رقم موجب";
    if (!(+s.pct >= 0 && +s.pct <= 100)) e[k("pct")] = "0–100";
  });
  const m = metrics(p);
  if (+p.budget > 0 && Math.abs(m.monthlyTotal - p.budget) > 0.5) w.push(`التوزيع الشهري (${sar(m.monthlyTotal)}) لا يساوي موازنة المشروع (${sar(p.budget)}).`);
  if (p.steps.length && Math.abs(m.stepsCost - p.budget) > 0.5) w.push(`مجموع تكاليف الخطوات (${sar(m.stepsCost)}) يختلف عن الموازنة (${sar(p.budget)}).`);
  if (!p.manager) w.push("لم يُحدَّد مدير المشروع.");
  if (!p.steps.length) w.push("لا توجد خطوات تنفيذ؛ ستُحسب نسبة الإنجاز يدوياً.");
  return {e, w, ok: Object.keys(e).length === 0};
}

/* ======================= طبقة التخزين ======================= */
const Store = {
  unsubs: [],
  async init() {
    const [db, user, downloads] = await Promise.all([
      window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null, window.claude?.use?.("downloads") ?? null,
    ].map(p => Promise.resolve(p).catch(() => null)));
    S.downloads = downloads; S.user = user;
    if (db) {
      S.db = db; S.mode = "db";
      S.me = user ? await user.id() : null;
      const [admin, w] = user ? await Promise.all([user.canEdit(), user.can("data.write")]) : [false, null];
      S.canAdmin = !!admin; S.canWrite = admin || w !== false;
      this.subscribe();
    } else {
      S.mode = "local"; S.canWrite = true; S.canAdmin = true;
      const saved = safeLS("opplan.local");
      if (saved?.projects?.length) { S.master = saved.master || S.master; saved.projects.forEach(p => S.projects.set(p.id, p)); S.audit = saved.audit || []; S.kpiT = saved.kpiT || {}; S.kpiA = saved.kpiA || {}; S.deptKeys = saved.deptKeys || {}; }
      else SAMPLES().forEach(p => S.projects.set(p.id, p));
      loadUI(); applyUI();
      if (!S.kpiT?.[yKey()] && !S.kpiA?.[yKey()]) { const k = kpiSamples(); S.kpiT = {[yKey()]: {targets: k.t, sample: true}}; S.kpiA = {[yKey()]: {actuals: k.a, sample: true}}; }
    }
    renderChrome(); route();
  },
  subscribe() {
    const err = e => { if (e?.code === "revoked") { S.canWrite = false; renderChrome(); } };
    this.unsubs.push(S.db.doc("ref/master").onSnapshot(s => {
      if (s.exists) { const d = s.data(); S.master = {...clone(DEFAULT_MASTER), ...clone(d)}; } else S.master = clone(DEFAULT_MASTER);
      loadUI(); applyUI();
      softRender();
    }, err));
    this.unsubs.push(S.db.collection("projects").onSnapshot(q => {
      S.projects = new Map(q.docs.map(d => [d.id, {...d.data(), id: d.id}]));
      S.loaded = true; softRender();
    }, err));
    if (S.canAdmin) this.unsubs.push(S.db.doc("deptkeys/links").onSnapshot(s => { S.deptKeys = s.exists ? {...s.data()} : {}; if (S.view === "settings") softRender(); }, err));
    this.unsubs.push(S.db.collection("kpit").onSnapshot(q => { S.kpiT = Object.fromEntries(q.docs.map(d => [d.id, d.data()])); if (S.view === "strategic" && spState().page !== "entry") softRender(); }, err));
    this.unsubs.push(S.db.collection("kpia").onSnapshot(q => { S.kpiA = Object.fromEntries(q.docs.map(d => [d.id, d.data()])); if (S.view === "strategic" && spState().page !== "entry") softRender(); }, err));
    this.unsubs.push(S.db.collection("audit").orderBy("at", "desc").limit(400).onSnapshot(q => {
      S.audit = q.docs.map(d => ({...d.data(), id: d.id})); if (S.view === "audit") softRender();
    }, err));
  },
  persistLocal() { safeLS("opplan.local", {master: S.master, projects: [...S.projects.values()], audit: S.audit.slice(0, 400), kpiT: S.kpiT, kpiA: S.kpiA, deptKeys: S.deptKeys}); },
  async write(fn) {
    try { await fn(); return true; }
    catch (e) {
      if (e?.code === "invalid_argument" && S.mode === "db") { S.canWrite = false; renderChrome(); toast("ليست لديك صلاحية التعديل على هذه البيانات."); }
      else if (e?.code === "quota_exceeded") toast("امتلأت سعة قاعدة البيانات. احذف بيانات قديمة ثم أعد المحاولة.");
      else if (e?.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { await fn(); return true; } catch { toast("تعذّر الحفظ مؤقتاً. أعد المحاولة."); } }
      else toast("تعذّر الحفظ: " + (e?.message || e));
      return false;
    }
  },
  async saveProject(p, prev, action) {
    p.updatedAt = new Date().toISOString(); p.updatedBy = S.me || "local";
    if (!prev) { p.createdAt = p.updatedAt; p.createdBy = p.updatedBy; }
    const entry = auditEntry(action || (prev ? "update" : "create"), p, prev);
    if (S.mode === "local") {
      S.projects.set(p.id, clone(p)); if (entry) S.audit.unshift(entry); this.persistLocal(); return true;
    }
    const ok = await this.write(() => S.db.collection("projects").doc(p.id).set(clone(p)));
    if (ok && entry) await this.write(() => S.db.collection("audit").doc(entry.id).set(entry));
    return ok;
  },
  async hardDelete(p) {
    if (S.mode === "local") { S.projects.delete(p.id); this.persistLocal(); return true; }
    return this.write(() => S.db.collection("projects").doc(p.id).delete());
  },
  async saveMaster(m, note) {

const FIELD_LABELS = {name: "اسم المشروع", description: "الشرح", objectiveId: "الهدف", kpiId: "المؤشر", deptId: "الإدارة", section: "القسم المنفذ", branch: "الفرع/القطاع", priority: "الأولوية", manager: "مدير المشروع", budget: "الموازنة", manualProgress: "نسبة الإنجاز اليدوية", deleted: "محذوف"};
function showVal(f, v) {
  if (f === "objectiveId") return v ? `${v} ${objOf(v)?.name || ""}` : "—";
  if (f === "kpiId") return v ? `${v} ${kpiOf(v)?.name || ""}` : "—";
  if (f === "deptId") return deptOf(v)?.name || "—";
  if (f === "budget") return sar(v);
  if (f === "deleted") return v ? "نعم" : "لا";
  return v === "" || v == null ? "—" : String(v);
}
function auditEntry(action, p, prev) {
  const changes = [];
  if (action === "create" || action === "import") changes.push({field: "إنشاء", from: "", to: `${p.code} — ${p.name}`});
  else if (prev) {
    for (const f of Object.keys(FIELD_LABELS)) if ((prev[f] ?? "") !== (p[f] ?? "") && !(f === "deleted" && !prev[f] && !p[f])) changes.push({field: FIELD_LABELS[f], from: showVal(f, prev[f]), to: showVal(f, p[f])});
    const pm = prev.monthly || [], nm = p.monthly || [];
    const months = S.master.months.filter((_, i) => (+pm[i] || 0) !== (+nm[i] || 0));
    if (months.length) changes.push({field: "التوزيع الشهري", from: months.map(m => `${m} ${fmt(pm[S.master.months.indexOf(m)])}`).join("، "), to: months.map(m => `${m} ${fmt(nm[S.master.months.indexOf(m)])}`).join("، ")});
    const pmap = new Map((prev.steps || []).map(s => [s.id, s]));
    for (const s of p.steps || []) {
      const o = pmap.get(s.id); pmap.delete(s.id);
      if (!o) { changes.push({field: "خطوة جديدة", from: "", to: s.name}); continue; }
      const d = [];
      for (const [f, l] of [["name", "الاسم"], ["owner", "المسؤول"], ["cost", "التكلفة"], ["planStart", "بداية الخطة"], ["planWeeks", "مدة الخطة"], ["actStart", "البداية الفعلية"], ["actWeeks", "مدة التنفيذ"], ["pct", "الإنجاز٪"], ["needs", "الاحتياجات"]])
        if ((o[f] ?? "") != (s[f] ?? "")) d.push([l, o[f], s[f]]);
      if (d.length) changes.push({field: `خطوة: ${s.name}`, from: d.map(x => `${x[0]} ${x[1] ?? "—"}`).join("، "), to: d.map(x => `${x[0]} ${x[2] ?? "—"}`).join("، ")});
    }
    for (const s of pmap.values()) changes.push({field: "حذف خطوة", from: s.name, to: ""});
    if ((p.updates || []).length > (prev.updates || []).length) changes.push({field: "تحديث حالة المشروع", from: "", to: p.updates[p.updates.length - 1].text});
  }
  if (action !== "create" && action !== "import" && !changes.length) return null;
  return {id: uid("a"), at: new Date().toISOString(), by: S.me || "local", action, projectId: p.id, projectName: `${p.code} — ${p.name}`, changes, ...(S.view === "portal" && S.portal ? {via: "بوابة " + (deptOf(S.portal.dept)?.name || "")} : {})};
}

function filtered() {

    (!q || [p.name, p.code, p.manager, p.description].join(" ").includes(q)) &&
    (!f.obj || p.objectiveId === f.obj) && (!f.dept || p.deptId === f.dept) && (!f.pri || String(p.priority) === f.pri) && (!f.status || m.status === f.status));
  const key = {code: x => x.p.code, name: x => x.p.name, obj: x => x.p.objectiveId, dept: x => deptOf(x.p.deptId)?.name || "", pri: x => x.p.priority, budget: x => +x.p.budget, prog: x => x.m.progress, status: x => x.m.status, manager: x => x.p.manager || ""}[f.sort];

function gantt(p) {

const GROUPS = {

};
function reportRows() {
  const [, fn] = GROUPS[S.reportBy], g = new Map();

  return [...g.entries()].map(([k, a]) => { const ms = a.map(p => metrics(p)); return {k, n: a.length, budget: sum(a.map(p => p.budget)), share: sum(a.map(p => p.budget)) / total * 100, prog: sum(ms.map(m => m.progress)) / a.length, exp: sum(ms.map(m => m.expected)) / a.length, late: ms.filter(m => m.status === "late").length}; }).sort((a, b) => b.budget - a.budget);
}
function qualityIssues() {
  const out = [];
  for (const p of liveProjects()) {
    const m = metrics(p);
    if (p.budget > 0 && Math.abs(m.monthlyTotal - p.budget) > .5) out.push([p, "التوزيع الشهري لا يساوي الموازنة", `${sar(m.monthlyTotal)} مقابل ${sar(p.budget)}`]);

    if (!p.manager) out.push([p, "مدير المشروع غير محدد", ""]);
    if (!p.steps?.length) out.push([p, "لا توجد خطوات تنفيذ", "الإنجاز يدوي"]);
    if (m.lateWeeks > 0) out.push([p, "أسابيع مجدولة مضت بلا إنجاز مسجل", `${m.lateWeeks} أسبوع`]);
  }
  return out;
}

async function saveFile(name, sheets, type = "xlsx") {
  if (!window.XLSX) return toast("مكتبة Excel لم تُحمّل. تحقق من الاتصال.");
  let data, filename;
  if (type === "csv") { data = "﻿" + XLSX.utils.sheet_to_csv(XLSX.utils.aoa_to_sheet(sheets[0].rows)); filename = name + ".csv"; }
  else {
    const wb = XLSX.utils.book_new(); wb.Workbook = {Views: [{RTL: true}]};
    for (const s of sheets) { const ws = XLSX.utils.aoa_to_sheet(s.rows); ws["!cols"] = s.rows[0].map((_, i) => ({wch: Math.min(48, Math.max(8, ...s.rows.slice(0, 200).map(r => String(r[i] ?? "").length)) + 2)})); XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0, 31)); }
    data = new Blob([XLSX.write(wb, {bookType: "xlsx", type: "array"})]); filename = name + ".xlsx";
  }
  if (!S.downloads) return toast("التنزيل متاح عند فتح النظام داخل Claude.");
  try { await S.downloads.save({filename, data}); toast("جُهّز الملف للتنزيل"); }
  catch (e) { if (e?.code !== "declined") toast(e?.code === "rate_limited" ? "نافذة تنزيل مفتوحة بالفعل." : "تعذّر التنزيل في هذا العرض."); }
}
/* ---- ETL داخل المتصفح: قراءة قالب الخطة التشغيلية أو ملف التصدير ---- */
const PH = /^[.\s…]*$/;
const cleanTxt = v => { if (v == null) return ""; let s = String(v).normalize("NFC").replace(/^'/, "").replace(/[\t ]+/g, " ").replace(/ {2,}/g, " ").trim(); return PH.test(s) ? "" : s; };
const normCode = c => cleanTxt(c).replace(/\s+/g, "");
function matchBy(list, txt, key = "name") { const t = cleanTxt(txt); if (!t) return null; return list.find(x => x[key] === t || x.code === normCode(t) || x.id === normCode(t)) || null; }
function parseWorkbook(wb) {
  const out = {projects: [], notes: [], master: null};
  const sheet = n => wb.Sheets[wb.SheetNames.find(s => s.trim() === n.trim())];
  const aoa = ws => XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: null});
  // البيانات المرجعية
  const ks = sheet("كشاف الأهداف والمؤشرات") || sheet("الأهداف والمؤشرات");
  if (ks) {
    const r = aoa(ks); const objectives = [], kpis = []; const seen = new Set();
    const hdr = r.findIndex(row => row.some(c => String(c || "").includes("رمز الهدف")));
    const ci = r[hdr] || []; const iOc = ci.findIndex(c => String(c || "").includes("رمز الهدف")), iOn = iOc + 1, iKc = ci.findIndex(c => String(c || "").includes("رمز المؤشر")), iKn = iKc + 1;
    for (const row of r.slice(hdr + 1)) { const oc = normCode(row[iOc]), on = cleanTxt(row[iOn]), kc = normCode(row[iKc]), kn = cleanTxt(row[iKn]); if (!oc || !on || !kc || !kn) continue; if (!seen.has(oc)) { seen.add(oc); objectives.push({id: oc, code: oc, name: on, perspective: oc[0]}); } kpis.push({id: kc, code: kc, name: kn, objectiveId: oc, unit: kn.startsWith("نسبة") ? "نسبة مئوية" : kn.startsWith("عدد") ? "عدد" : kn.includes("إيراد") ? "ريال" : kn.startsWith("مستوى") ? "مستوى" : "أخرى"}); }
    if (objectives.length) { out.master = {objectives, kpis}; out.notes.push(`قُرئ ${objectives.length} هدفاً و${kpis.length} مؤشراً من «${ks === sheet("الأهداف والمؤشرات") ? "الأهداف والمؤشرات" : "كشاف الأهداف والمؤشرات"}».`); }
  }
  // كشاف المشاريع
  const reg = sheet("كشاف المشاريع");
  const stepsSheet = sheet("خطوات التنفيذ");
  const stepsBy = {};
  if (stepsSheet) for (const row of aoa(stepsSheet).slice(1)) { const c = cleanTxt(row[0]); if (!c || !cleanTxt(row[3])) continue; (stepsBy[c] ||= []).push({id: uid("s"), name: cleanTxt(row[3]), needs: cleanTxt(row[4]) || "بشرية", owner: cleanTxt(row[5]), cost: +row[6] || 0, planStart: +row[7] || 1, planWeeks: +row[8] || 1, actStart: +row[9] || 0, actWeeks: +row[10] || 0, pct: Math.round((+row[11] || 0) * ((+row[11] || 0) <= 1 ? 100 : 1))}); }
  if (reg) {
    const r = aoa(reg);
    const hi = r.findIndex(row => row.some(c => String(c || "").startsWith("اسم المشروع")));
    const H = (r[hi] || []).map(c => cleanTxt(c));
    const col = t => H.findIndex(h => h.startsWith(t));
    const iName = col("اسم المشروع"), iPri = col("تصنيف الأولوية"), iDesc = col("شرح المشروع"), iMgr = col("مدير المشروع"), iPct = col("نسبة الإنجاز"), iBud = col("موازنة المشروع"), iJan = col("يناير"), iCode = col("الرمز"), iObj = col("رمز الهدف"), iKpi = col("رمز المؤشر"), iDept = col("الإدارة"), iSec = col("القسم"), iBr = col("الفرع");
    let skipped = 0;
    for (const row of r.slice(hi + 1)) {
      const name = cleanTxt(row[iName]);
      if (!name || name === "الخطة") { if (row.some(c => c != null && c !== 0)) skipped++; continue; }
      const monthly = iJan >= 0 ? Array.from({length: 12}, (_, i) => +row[iJan + i] || 0) : Array(12).fill(0);
      const code = iCode >= 0 ? cleanTxt(row[iCode]) : "";
      const p = {id: uid("p"), code, name, description: cleanTxt(row[iDesc]), manager: cleanTxt(row[iMgr]), priority: [1, 2, 3].includes(+row[iPri]) ? +row[iPri] : 2,
        budget: +row[iBud] || sum(monthly), monthly, steps: stepsBy[code] || [], manualProgress: Math.round((+row[iPct] || 0) * ((+row[iPct] || 0) <= 1 ? 100 : 1)),
        objectiveId: iObj >= 0 ? normCode(row[iObj]) : "", kpiId: iKpi >= 0 ? normCode(row[iKpi]) : "", deptId: iDept >= 0 ? (matchBy(S.master.departments, row[iDept])?.id || "") : "", section: iSec >= 0 ? cleanTxt(row[iSec]) : "", branch: iBr >= 0 ? cleanTxt(row[iBr]) : ""};
      out.projects.push(p);
    }
    out.notes.push(`كشاف المشاريع: ${out.projects.length} مشروعاً صالحاً، وتجاهل ${skipped} صفاً شكلياً (.............).`);
  }
  // ورقة بطاقة المشروع (قالب «مشروع»)
  const card = sheet("مشروع");
  if (card) {
    const r = aoa(card); const name = cleanTxt(r[1]?.[2]);
    if (name && name !== "الخطة") {
      const obj = matchBy(S.master.objectives, r[2]?.[2]), kpi = matchBy(S.master.kpis, r[3]?.[2]), dept = matchBy(S.master.departments, r[4]?.[2]);
      const steps = [];
      for (const row of r.slice(11, 30)) { const sn = cleanTxt(row[1]); if (!sn) continue; steps.push({id: uid("s"), name: sn, needs: cleanTxt(row[2]) || "بشرية", owner: cleanTxt(row[3]), cost: +row[4] || 0, planStart: +row[5] || 1, planWeeks: +row[6] || 1, actStart: +row[7] || 0, actWeeks: +row[8] || 0, pct: 0}); }
      const ex = out.projects.find(p => p.name === name);
      const base = ex || {id: uid("p"), code: "", name, description: "", manager: "", priority: 2, monthly: Array(12).fill(0), manualProgress: 0, section: "", branch: ""};
      Object.assign(base, {objectiveId: obj?.id || base.objectiveId || "", kpiId: kpi?.id || base.kpiId || "", deptId: dept?.id || base.deptId || "", steps});
      base.budget = base.budget || sum(steps.map(s => s.cost));
      if (!ex) out.projects.push(base);
      out.notes.push(`بطاقة المشروع «${name}»: ${steps.length} خطوة.`);
    } else out.notes.push("ورقة «مشروع» تحتوي القالب الفارغ فقط (اسم المشروع «الخطة») — لم تُستورد.");
  }
  let n = Math.max(0, ...[...S.projects.values()].map(p => +(p.code || "").split("-").pop() || 0));
  for (const p of out.projects) {
    const ex = p.code && [...S.projects.values()].find(x => x.code === p.code);
    if (ex) { p.id = ex.id; p._update = true; continue; }   // نفس الرمز ← تحديث المشروع القائم بدل التكرار
    if (!p.code) p.code = `P-${S.master.year}-${String(++n).padStart(3, "0")}`;
  }
  return out;
}

function arcPath(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.cos(a * Math.PI / 180), cy - r * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${Math.abs(a0 - a1) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function gaugeSvg(val, target, text) {
  const v = Math.max(0, Math.min(100, +val || 0)), ang = 180 - v / 100 * 180;
  const tg = target != null ? 180 - Math.min(100, target) / 100 * 180 : null;
  const pt = (a, r) => [100 + r * Math.cos(a * Math.PI / 180), 100 - r * Math.sin(a * Math.PI / 180)];
  return `<svg viewBox="0 0 200 124" class="gsvg" role="img" aria-label="${esc(text)}">
    <path d="${arcPath(100, 100, 78, 180, 0)}" fill="none" stroke="var(--track)" stroke-width="26"/>
    ${v > 0.3 ? `<path d="${arcPath(100, 100, 78, 180, Math.max(ang, 0.01))}" fill="none" stroke="var(--c1)" stroke-width="26"/>` : ""}
    ${tg != null ? (() => { const [x1, y1] = pt(tg, 62), [x2, y2] = pt(tg, 94); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--ink)" stroke-width="3"/>`; })() : ""}
    <text x="100" y="94" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">${pct(v)}</text>
    <text x="22" y="120" text-anchor="middle" font-size="10" fill="var(--muted)">0٪</text><text x="178" y="120" text-anchor="middle" font-size="10" fill="var(--muted)">100٪</text></svg>`;
}

const NEEDS = ["بشرية", "مرافق", "أجهزة", "مطبوعات", "أخرى"];
const PT_EXAMPLE = `دراسة الاحتياج وتصميم البرنامج | إدارة المشاريع | أسبوعين | 8000 ريال
التعاقد مع المدربين والقاعة | الخدمات المساندة | 3 أسابيع | 45 ألف | مرافق
+ التسويق والتسجيل | الاتصال المؤسسي | شهر | 12000 | مطبوعات
تنفيذ البرنامج | إدارة المشاريع | 6 أسابيع
قياس الأثر ورضا المستفيدين | الجودة | أسبوعين`;
function normDigits(t) { return String(t).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g, ".").replace(/٬/g, ","); }
function parsePlanLine(raw) {
  let t = normDigits(raw).trim(); if (!t) return null;
  const it = {name: "", owner: "", needs: "", weeks: null, start: null, cost: null, parallel: false, raw};
  t = t.replace(/^\s*(?:[-•*–·]|\d{1,2}\s*[.)\-–])\s*/, "");
  if (/^\+/.test(t) || /بالتوازي|بالتزامن/.test(t)) { it.parallel = true; t = t.replace(/^\+\s*/, "").replace(/\(?\s*(بالتوازي|بالتزامن)[^|،,؛]*\)?/g, ""); }
  const take = (re, fn) => { const m = t.match(re); if (m) { fn(m); t = t.replace(m[0], " "); } };
  take(/(?:من|يبدأ(?:\s*من)?|بداية)\s*(?:ال)?[أا]سبوع\s*(\d{1,2})/, m => it.start = +m[1]);
  take(/(?:@|المسؤول\s*[:：]|مسؤول\s*[:：])\s*([^|،,؛\-–]+)/, m => it.owner = m[1].trim());
  take(/(\d[\d,]*(?:\.\d+)?)\s*(ألف|الف|k|K)?\s*(ريال|ر\.?\s?س|SAR|﷼)/, m => it.cost = parseFloat(m[1].replace(/,/g, "")) * (m[2] ? 1000 : 1));
  if (it.cost == null) take(/(\d[\d,]*(?:\.\d+)?)\s*(ألف|الف|k|K)(?![؀-ۿ])/, m => it.cost = parseFloat(m[1].replace(/,/g, "")) * 1000);
  take(/[أا]سبوعين/, () => it.weeks = 2);
  if (it.weeks == null) take(/شهرين/, () => it.weeks = 8);
  if (it.weeks == null) take(/(\d+(?:\.\d+)?)\s*(?:[أا]سابيع|[أا]سبوع|w\b|wk|weeks?)/i, m => it.weeks = Math.max(1, Math.round(+m[1])));
  if (it.weeks == null) take(/(\d+(?:\.\d+)?)\s*(?:[أا]شهر|شهور|شهر)/, m => it.weeks = Math.max(1, Math.round(+m[1] * 4)));
  if (it.weeks == null) take(/(\d+)\s*(?:يوم|[أا]يام)/, m => it.weeks = Math.max(1, Math.ceil(+m[1] / 7)));
  if (it.weeks == null) take(/(?:^|[\s|،,؛])(شهر|[أا]سبوع)(?=$|[\s|،,؛])/, m => it.weeks = m[1] === "شهر" ? 4 : 1);
  for (const n of NEEDS) { const re = new RegExp(`(?:^|[\\s|،,؛(])(?:احتياج\\s*[:：]?\\s*)?(${n})(?=$|[\\s|،,؛)])`); if (!it.needs && re.test(t)) { it.needs = n; t = t.replace(re, " "); } }
  const parts = t.split(/\s*[|،,؛\t]\s*|\s+[-–]\s+/).map(x => x.replace(/^[\s\-–:]+|[\s\-–:]+$/g, "").trim()).filter(x => /[\u0600-\u06FFA-Za-z0-9]/.test(x));
  for (const x of parts.slice(1)) {
    if (/^\d+(\.\d+)?$/.test(x)) { const v = +x; if (v > 52) { if (it.cost == null) it.cost = v; } else if (it.weeks == null) it.weeks = Math.max(1, Math.round(v)); }
    else if (!it.owner) it.owner = x;
  }
  it.name = (parts[0] || "").replace(/\s{2,}/g, " ").replace(/\s+(لمدة|مدته|مدة|خلال|على مدى)\s*$/, "").trim();
  return it.name ? it : null;
}
function ptState(p) { return S.planTxt ||= {open: false, text: "", start: Math.max(1, Math.min(52, currentWeek(S.master.year) || 1)), mode: "seq", end: 52, defDur: 2, distBudget: true, replace: !(p?.steps?.length), autoBudget: true}; }
function layoutPlan(st, p) {
  const items = st.text.split(/\r?\n/).map(parsePlanLine).filter(Boolean);
  const warn = [];
  if (!items.length) return {items, steps: [], warn};

    if (k < 1) warn.push(`ضُغطت المدد بنسبة ${Math.round(k * 100)}٪ لتتسع بين الأسبوع ${start} والأسبوع ${end}.`);
  } else {

  }
  items.forEach(it => { if (it.start != null && st.mode === "fit") { it._s = it.start; } });
  const over = items.filter(it => it._s + it._w - 1 > 52);
  if (over.length) warn.push(`${over.length} خطوة تتجاوز الأسبوع 52 من السنة.`);
  // التكاليف
  const known = sum(items.map(it => it.cost || 0)), budget = +p.budget || 0, missing = items.filter(it => it.cost == null);

function countUps(root) {
  $$(".pcardv .cv, .cmpn b, .tile .val, .kcard .val, .pres-num", root).forEach(el => {
    if (el.children.length) return;
    const txt = el.textContent, m = txt.match(/-?[\d,]*\.?\d+/); if (!m) return;
    const raw = m[0], target = parseFloat(raw.replace(/,/g, "")); if (!isFinite(target) || target === 0) return;
    const dec = (raw.split(".")[1] || "").length, grp = raw.includes(",") || Math.abs(target) >= 1000;
    const pre = txt.slice(0, m.index), suf = txt.slice(m.index + raw.length), t0 = performance.now(), D = 750;
    const f = v => v.toLocaleString("en-US", {minimumFractionDigits: dec, maximumFractionDigits: dec, useGrouping: grp});
    const tick = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3); el.textContent = pre + f(target * e) + suf; if (k < 1) requestAnimationFrame(tick); else el.textContent = txt; };
    requestAnimationFrame(tick);
  });
}

  else if (e.key === "Escape" && !document.fullscreenElement) stopPresent();
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && S.present?.on) stopPresent(); });

/* ======================= تشغيل ======================= */
window.addEventListener("hashchange", () => { if (S.view !== "settings") S.mEdit = null; });
initLabels();
$$(".themeseg button").forEach(b => b.onclick = () => setTheme(b.dataset.theme));
$("#fxBtn").onclick = () => setFx(!S.fx);
$("#custBtn").onclick = () => { const d = $("#cust"); if (d?.classList.contains("open")) d.classList.remove("open"); else openCustomizer(); };
loadUI(); applyUI();
$("#presBtn").onclick = () => { if (S.view === "strategic" && spState().page === "entry") spState().page = "summary"; if (!["exec", "tasksdb", "strategic"].includes(S.view)) { S.view = "exec"; history.replaceState(null, "", "#exec"); } startPresent(); };
applyTheme(); renderChrome(); render();
Store.init();
</script>
